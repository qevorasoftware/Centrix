<!DOCTYPE html>
<html lang="en" id="palette">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1.0, maximum-scale = 1.0, user-scalable = no">
    <meta name="format-detection" content="telephone=no">
    <meta name="title" content="Centrix - Right Sidebar Visible">
    <meta name="description" content="Right sidebar (theme options) visible on Centrix.">
    <meta name="keywords" content="Admin Panel, Dashboard, Centrix Dashboard, AdminTemplates">
    <meta name="author" content="Centrix">
    <meta name=theme-color content="#000000">
    <title>Centrix - Right Sidebar Visible</title>
    <meta property=og:title content="Centrix - Right Sidebar Visible">
    <meta property=og:description content="Right sidebar (theme options) visible on Centrix.">
    <link rel="icon" type="image/x-icon" href="../assets/images/icon/favicon.svg">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="stylesheet" href="../assets/css/media.css">
</head>

<body class="page-full-width page-right-sidebar-visible light-mode" id="body">
    <centrix-header></centrix-header>
    <div id="main" class="main-wrapper fullwidthlayout">
        <!-- Hero banner: full-width .breadcrumb, kept OUTSIDE #content (same as Full Width) -->
        <div class="breadcrumb fw-hero">
            <h1>Right Sidebar</h1>
            <p>Visible</p>
        </div>

        <div id="content" class="section-wrapper content">
            <div class="body_part">
                <div class="fw-wrap">
                    <div class="fw-card">
                        <div class="fw-card-head">
                            <h3>Right Sidebar</h3>
                        </div>
                        <div class="fw-card-body">
                            <p>Right Sidebar Visible.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <centrix-footer></centrix-footer>

    <script src="../components/js/header-footer-themeoptions.js"></script>
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/custom.js"></script>
    <script src="../assets/js/extra.js"></script>
    <script>
        // Right sidebar (theme options panel) is visible on load, without the dimming backdrop
        $(document).ready(function () {
            $('#theme-option').addClass('theme-option-open');
        });
    </script>
</body>

</html>
