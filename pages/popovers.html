<!doctype html>
<html lang="en" id="palette">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1.0, maximum-scale = 1.0, user-scalable = no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="title" content="Centrix - Popovers" />
    <meta name="description" content="Button styles on Centrix." />
    <meta name="keywords" content="Admin Panel, Dashboard, Centrix Dashboard, AdminTemplates" />
    <meta name="author" content="Centrix" />
    <meta name="theme-color" content="#000000" />
    <title>Centrix - Popovers</title>
    <meta property="og:title" content="Centrix - Popovers" />
    <meta property="og:description" content="Button styles on Centrix." />
    <link rel="icon" type="image/x-icon" href="../assets/images/icon/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/custom.css" />
    <link rel="stylesheet" href="../assets/css/media.css" />
  </head>

  <body class="page-full-width page-popovers light-mode" id="body">
    <centrix-header></centrix-header>
    <div id="main" class="main-wrapper fullwidthlayout">
      <!-- Hero banner: full-width .breadcrumb, kept OUTSIDE #content (same as Full Width) -->
      <div class="breadcrumb fw-hero">
        <h1>Popovers</h1>
        <p>Elements</p>
      </div>

      <div id="content" class="section-wrapper content">
        <div class="body_part">
          <div class="fw-wrap">
            <div class="pp-section">
              <div class="pp-section-head"><h3>Popovers Style</h3></div>
              <div class="pp-section-body">
                <div class="pp-grid">
                  <div class="pp-card">
                    <div class="pp-card-head"><h4>Left/Right</h4></div>
                    <div class="pp-card-body pp-two">
                      <div class="pp-wrap">
                        <button type="button" class="pp-btn">Left</button>
                        <div class="pp-tip pp-tip-left">
                          <div class="pp-tip-title">Title</div>
                          <div class="pp-tip-body">Content will be here</div>
                        </div>
                      </div>
                      <div class="pp-wrap">
                        <button type="button" class="pp-btn">Right</button>
                        <div class="pp-tip pp-tip-right">
                          <div class="pp-tip-title">Title</div>
                          <div class="pp-tip-body">Content will be here</div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="pp-card">
                    <div class="pp-card-head"><h4>Top/Bottom</h4></div>
                    <div class="pp-card-body pp-two">
                      <div class="pp-wrap">
                        <button type="button" class="pp-btn">Top</button>
                        <div class="pp-tip pp-tip-top">
                          <div class="pp-tip-title">Title</div>
                          <div class="pp-tip-body">Content will be here</div>
                        </div>
                      </div>
                      <div class="pp-wrap">
                        <button type="button" class="pp-btn">Bottom</button>
                        <div class="pp-tip pp-tip-bottom">
                          <div class="pp-tip-title">Title</div>
                          <div class="pp-tip-body">Content will be here</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <centrix-footer></centrix-footer>

    <script src="../components/js/header-footer-themeoptions.js"></script>
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/custom.js"></script>
    <script src="../assets/js/extra.js"></script>
  </body>
</html>
